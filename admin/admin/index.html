<html lang="ru">
<head>
      <link rel="apple-touch-icon" sizes="57x57" href="/apple-icon-57x57.png">
<link rel="apple-touch-icon" sizes="60x60" href="/apple-icon-60x60.png">
<link rel="apple-touch-icon" sizes="72x72" href="/apple-icon-72x72.png">
<link rel="apple-touch-icon" sizes="76x76" href="/apple-icon-76x76.png">
<link rel="apple-touch-icon" sizes="114x114" href="/apple-icon-114x114.png">
<link rel="apple-touch-icon" sizes="120x120" href="/apple-icon-120x120.png">
<link rel="apple-touch-icon" sizes="144x144" href="/apple-icon-144x144.png">
<link rel="apple-touch-icon" sizes="152x152" href="/apple-icon-152x152.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-icon-180x180.png">
<link rel="icon" type="image/png" sizes="192x192"  href="/android-icon-192x192.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/manifest.json">
<meta name="msapplication-TileColor" content="#ffffff">
<meta name="msapplication-TileImage" content="/ms-icon-144x144.png">
<meta name="theme-color" content="#ffffff">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mahomka Admin Hub</title>
</head>
<body style="margin: 0; background-color: #1a1a1a;">

  <script type="text/yaml" id="cms-config">
    backend:
      name: github
      repo: mahimka1321/my-portfolio
      branch: main

    media_folder: "src/assets"
    public_folder: "/my-portfolio/assets"

    collections:
      - name: "projects_collection"
        label: "Мои Дизайны"
        folder: "src/data"
        file: "src/data/projectsData.json"
        format: "json"
        fields:
          - name: "items"
            label: "Список проектов"
            widget: "list"
            allow_remove: false
            # 🔥 МАГИЯ ТУТ: Сворачивает проекты в компактные аккордеоны с заголовком ID
            summary: "{{id}} — {{title}}"
            collapsed: true 
            fields:
              - { label: 'ID проекта (латиницей)', name: 'id', widget: 'string' }
              - { label: 'Главный Заголовок', name: 'title', widget: 'string' }
              - { label: 'Подзаголовок', name: 'subtitle', widget: 'string' }
              - { label: 'Описание проекта', name: 'description', widget: 'text' }
              - { label: 'Задача бизнеса', name: 'task', widget: 'text' }
              
              # Компактный список результатов
              - name: "results"
                label: "Результаты"
                widget: "list"
                collapsed: true
                summary: "{{result}}"
                field: {name: 'result', widget: 'string', label: 'Текст результата'}
              
              # Компактный список цветов с пипеткой
              - name: "colors"
                label: "Палитра цветов проекта"
                widget: "list"
                collapsed: true
                summary: "{{colorCode}}"
                field: { label: 'Выбрать цвет', name: 'colorCode', widget: 'color' }

              - { label: 'Шрифты проекта', name: 'fonts', widget: 'string' }
              - { label: 'Загрузить SVG макет', name: 'previewAsset', widget: 'file' }
              
              # Компактный список тегов
              - name: "tags"
                label: "Теги проекта"
                widget: "list"
                collapsed: true
                summary: "{{tag}}"
                field: {name: 'tag', widget: 'string', label: 'Имя тега (например: UI/UX)'}
                
              - { label: 'Тип макета (для превью)', name: 'deviceType', widget: 'select', options: ['desktop', 'mobile'], default: 'desktop', required: true }
  </script>

  <script src="./confirm-delete.js"></script>
  <script src="./sveltia-cms.js" type="module"></script>

</body>
</html>
