<html lang="ru">
<head>

<link rel="apple-touch-icon" sizes="76x76" href="/apple-icon-76x76.png">
<link rel="apple-touch-icon" sizes="114x114" href="/apple-icon-114x114.png">
<link rel="apple-touch-icon" sizes="120x120" href="/apple-icon-120x120.png">
<link rel="apple-touch-icon" sizes="144x144" href="/apple-icon-144x144.png">
<link rel="apple-touch-icon" sizes="152x152" href="/apple-icon-152x152.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-icon-180x180.png">
<link rel="icon" type="image/png" sizes="192x192"  href="/android-icon-192x192.png">

<meta name="msapplication-TileColor" content="#ffffff">
<meta name="msapplication-TileImage" content="/ms-icon-144x144.png">
<meta name="theme-color" content="#ffffff">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mahomka Admin Hub</title>
</head>
<body style="margin: 0; background-color: #1a1a1a;">

  <script type="text/yaml" id="cms-config">
backend:
  name: github
  repo: mahimka1321/my-portfolio
  branch: main

media_folder: "public/assets"
public_folder: "/assets"

collections:
  - name: "designs"
    label: "Проекты веб-дизайна"
    folder: "src/data"
    extension: "json"
    create: true
    slug: "{{fields.id}}"
    identifier_field: "id"
    fields:
      - { label: "Уникальный ID проекта", name: "id", widget: "string" }
      - { label: "Название проекта", name: "title", widget: "string" }
      - { label: "Подзаголовок", name: "subtitle", widget: "string" }
      - { label: "Описание проекта", name: "description", widget: "text", required: false }
      - { label: "Задача проекта", name: "task", widget: "text" }
      - { label: "Результаты (каждый с новой строки)", name: "results", widget: "list" }
      - { label: "Палитра цветов (HEX-коды)", name: "colors", widget: "list" }
      - { label: "Основной шрифт", name: "fonts", widget: "string" }
      - { label: "Главное превью (Обложка)", name: "previewAsset", widget: "image" }
      - { label: "Теги", name: "tags", widget: "list" }
      - { label: "Тип устройства", name: "deviceType", widget: "select", options: ["mobile", "desktop"] }
      - { label: "Цвет кнопки (HEX)", name: "buttonColor", widget: "string", required: false }
      
      # ДИНАМИЧЕСКИЙ ТАЙМЛАЙН ДЛЯ НАСТРОЙКИ СЛАЙДОВ В АДМИНКЕ
      - label: "Этапы прогресс-бара"
        name: "timelineSteps"
        widget: "list"
        summary: "{{fields.label}}"
        fields:
          - { label: "ID этапа (латиницей, например: concept, uikit, design, adaptive)", name: "id", widget: "string" }
          - { label: "Название этапа (по-русски)", name: "label", widget: "string" }
          - { label: "Картинка для этого этапа", name: "img", widget: "image", required: false }
          - label: "Под-этапы (слайды для дизайна)"
            name: "subSteps"
            widget: "list"
            required: false
            summary: "{{fields.label}}"
            fields:
              - { label: "ID слайда (например: home, tour, profil)", name: "id", widget: "string" }
              - { label: "Название слайда (английскими)", name: "label", widget: "string" }
              - { label: "Картинка слайда", name: "img", widget: "image" }

  </script>

  <script src="./sveltia-cms.js" type="module"></script>

</body>
</html>
