backend:
  name: github
  repo: mahimka1321/my-portfolio
  branch: main

# CMS uploads are web-served static files. Do not upload dynamic CMS media to
# src/assets: Create React App does not expose arbitrary files from that folder.
media_folder: "public/uploads"
public_folder: "/my-portfolio/uploads"

collections:
  - name: "projects_collection"
    label: "Мои дизайны"
    files:
      - name: "projects_data"
        label: "Проекты портфолио"
        file: "src/data/projectsData.json"
        format: "json"
        fields:
          - name: "items"
            label: "Список проектов"
            widget: "list"
            allow_remove: false
            summary: "{{fields.id}} — {{fields.title}}"
            collapsed: true
            fields:
              - { label: "ID проекта (латиницей)", name: "id", widget: "string" }
              - { label: "Главный заголовок", name: "title", widget: "string" }
              - { label: "Подзаголовок", name: "subtitle", widget: "string", required: false }
              - { label: "Описание проекта", name: "description", widget: "text", required: false }
              - { label: "Задача бизнеса", name: "task", widget: "text", required: false }
              - name: "results"
                label: "Результаты"
                widget: "list"
                required: false
                collapsed: true
                field: { label: "Текст результата", name: "result", widget: "string" }
              - name: "colors"
                label: "Палитра цветов"
                widget: "list"
                required: false
                collapsed: true
                field: { label: "Цвет", name: "colorCode", widget: "color" }
              - { label: "Шрифты проекта", name: "fonts", widget: "string", required: false }
              - { label: "Главное превью", name: "previewAsset", widget: "image", required: false }
              - { label: "Цитата сверху", name: "topQuote", widget: "string", required: false }
              - { label: "Цитата слева внизу", name: "leftQuote", widget: "string", required: false }
              - { label: "Цитата справа внизу", name: "rightQuote", widget: "string", required: false }
              - name: "tags"
                label: "Теги проекта"
                widget: "list"
                required: false
                collapsed: true
                field: { label: "Тег", name: "tag", widget: "string" }
              - { label: "Тип макета", name: "deviceType", widget: "select", options: ["desktop", "mobile"], default: "desktop", required: true }
              - name: "timelineSteps"
                label: "Этапы таймлайна"
                widget: "list"
                required: false
                collapsed: true
                summary: "{{fields.label}}"
                fields:
                  - { label: "ID этапа", name: "id", widget: "string" }
                  - { label: "Название этапа", name: "label", widget: "string" }
                  - { label: "Изображение этапа", name: "img", widget: "image", required: false }
                  - name: "subSteps"
                    label: "Подэтапы"
                    widget: "list"
                    required: false
                    collapsed: true
                    summary: "{{fields.label}}"
                    fields:
                      - { label: "ID подэтапа", name: "id", widget: "string" }
                      - { label: "Название подэтапа", name: "label", widget: "string" }
                      - { label: "Изображение подэтапа", name: "img", widget: "image", required: false }
