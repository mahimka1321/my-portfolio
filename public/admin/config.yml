    backend:
      name: github
      repo: mahimka1321/my-portfolio
      branch: main

    media_folder: "public/assets"
    public_folder: "/my-portfolio/assets"

    collections:
      - name: "projects_collection"
        label: "Мои Дизайны"
        folder: "src/data"
        file: "src/data/projectsData.json"
        format: "json"
        fields:
          - name: "items"
            label: "Список проектов"
            widget: "list"
            # 🔥 МАГИЯ ТУТ: Сворачивает проекты в компактные аккордеоны с заголовком ID
            summary: "{{id}} — {{title}}"
            collapsed: true 
            fields:
              - { label: 'ID проекта (латиницей)', name: 'id', widget: 'string' }
              - { label: 'Главный Заголовок', name: 'title', widget: 'string' }
              - { label: 'Подзаголовок', name: 'subtitle', widget: 'string' }
              - { label: 'Описание проекта', name: 'description', widget: 'text' }
              - { label: 'Задача бизнеса', name: 'task', widget: 'text' }
              
              # Компактный список результатов
              - name: "results"
                label: "Результаты"
                widget: "list"
                collapsed: true
                summary: "{{result}}"
                field: {name: 'result', widget: 'string', label: 'Текст результата'}
              
              # Компактный список цветов с пипеткой
              - name: "colors"
                label: "Палитра цветов проекта"
                widget: "list"
                collapsed: true
                summary: "{{colorCode}}"
                field: { label: 'Выбрать цвет', name: 'colorCode', widget: 'color' }

              - { label: 'Шрифты проекта', name: 'fonts', widget: 'string' }
              - { label: 'Загрузить SVG макет', name: 'previewAsset', widget: 'file' }
              - { label: 'Цитата сверху', name: 'topQuote', widget: 'string' }
              - { label: 'Цитата слева внизу', name: 'leftQuote', widget: 'string' }
              - { label: 'Цитата справа внизу', name: 'rightQuote', widget: 'string' }
              
              # Компактный список тегов
              - name: "tags"
                label: "Теги проекта"
                widget: "list"
                collapsed: true
                summary: "{{tag}}"
                field: {name: 'tag', widget: 'string', label: 'Имя тега (например: UI/UX)'}
                
              - { label: 'Тип макета (для превью)', name: 'deviceType', widget: 'select', options: ['desktop', 'mobile'], default: 'desktop', required: true }
              # Этапы прогресс-бара: у каждого этапа своё изображение и необязательные подэтапы
              - name: "timelineSteps"
                label: "Этапы прогресс-бара"
                widget: "list"
                required: false
                collapsed: true
                summary: "{{label}}"
                fields:
                  - { label: "ID этапа (латиницей)", name: "id", widget: "string" }
                  - { label: "Название этапа", name: "label", widget: "string" }
                  - { label: "Изображение этапа", name: "img", widget: "image", required: false }
                  - name: "subSteps"
                    label: "Подэтапы (необязательно)"
                    widget: "list"
                    required: false
                    collapsed: true
                    summary: "{{label}}"
                    fields:
                      - { label: "ID подэтапа", name: "id", widget: "string" }
                      - { label: "Название подэтапа", name: "label", widget: "string" }
                      - { label: "Изображение подэтапа", name: "img", widget: "image", required: false }
