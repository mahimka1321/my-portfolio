<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>React App</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root">
    <!-- 🔥 ВСЁ, ЧТО НАПИСАНО ТУТ, БРАУЗЕР ПОКАЖЕТ МГНОВЕННО, ПОКА ЖДЕТ КАРТУ И СКРИПТЫ -->
    <div id="global-preloader" style="
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #F9FBDF; /* Твой оригинальный цвет фона */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999999;
      font-family: 'Nunito', sans-serif;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    ">
      <!-- Вращающийся брутальный спиннер -->
      <div style="
        width: 60px;
        height: 60px;
        border: 4px solid #222529;
        border-top: 4px solid #F9C428;
        border-radius: 50%;
        animation: global-spin 1s linear infinite;
      "></div>
      
      <!-- Пульсирующий текст -->
      <span id="global-preloader-text" style="
        margin-top: 25px;
        font-size: 12px;
        font-weight: 800;
        color: #222529;
        text-transform: uppercase;
        letter-spacing: 3px;
        animation: global-pulse 1.5s infinite ease-in-out;
      ">SYSTEM INITIALIZATION</span>

      <!-- Вшиваем микро-стили анимаций прямо сюда, чтобы они завелись без внешних файлов -->
      <style>
        @keyframes global-spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes global-pulse {
          0%, 100% { opacity: 0.4; transform: scale(0.98); }
          50% { opacity: 1; transform: scale(1.02); }
        }
        /* Стили для мягкого скрытия */
        .preloader--hidden {
          opacity: 0 !important;
          visibility: hidden !important;
          pointer-events: none !important;
        }
      </style>
    </div>
  </div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
